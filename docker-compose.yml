services:
   backend:
      build:
         context: /mnt/user/appdata/llm-council
         dockerfile: Dockerfile.backend
      container_name: llm-council-backend
      env_file:
         - /mnt/user/appdata/llm-council/.env
      volumes:
         - /mnt/user/appdata/llm-council/data:/app/data
      ports:
         - "8001:8001"
      restart: unless-stopped

   frontend:
      build:
         context: /mnt/user/appdata/llm-council
         dockerfile: Dockerfile.frontend
      container_name: llm-council-frontend
      ports:
         - "5173:5173"
      depends_on:
         - backend
      restart: unless-stopped
